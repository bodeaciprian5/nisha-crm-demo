<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C1D1D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NISHA · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F1F0EB; --bone-2:#E7E5DE; --paper:#FFFFFF;
  --ink:#1C1D1D; --ink-2:#3A3B3B;
  --muted:#86867F; --muted-2:#9E9E9B;
  --line:#D8D6CE; --line-2:#CCCBC6;
  --sage:#6E7A6B; --clay:#A8785F; --sand:#B9A489; --slate:#5B6B73; --rose:#9A5B52; --gold:#C0A062;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Jost',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(28,29,29,.04),0 8px 24px -16px rgba(28,29,29,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bone);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2)}
::-webkit-scrollbar-track{background:transparent}

.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:400}
.serif{font-family:var(--serif);font-weight:300;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:232px;flex:0 0 232px;background:var(--ink);color:var(--bone);display:flex;flex-direction:column;padding:26px 0}
.brand{padding:0 26px 30px;border-bottom:1px solid rgba(241,240,235,.12);margin-bottom:22px}
.brand .lg{width:118px;height:auto;color:#fff;display:block;margin-bottom:12px}
.brand .sub{font-size:7.5px;letter-spacing:.26em;text-transform:uppercase;color:rgba(241,240,235,.45)}
.brandbar{display:none;align-items:center;gap:11px;min-width:0;flex:1}
.brandbar .lgw{height:13px;width:auto;flex:0 0 auto;color:var(--ink)}
.crumb{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  padding-left:11px;border-left:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{flex:1;overflow-y:auto}
.nav .grp{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(241,240,235,.32);padding:16px 26px 8px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 26px;font-size:12.5px;letter-spacing:.06em;color:rgba(241,240,235,.66);border-left:2px solid transparent;transition:.15s}
.nav a:hover{color:#fff;background:rgba(241,240,235,.04)}
.nav a.on{color:#fff;border-left-color:var(--sand);background:rgba(241,240,235,.06)}
.nav a .ico{width:15px;text-align:center;opacity:.8;font-size:13px}
.nav a .cnt{margin-left:auto;font-size:10px;color:rgba(241,240,235,.4)}
.sidefoot{padding:18px 26px 0;border-top:1px solid rgba(241,240,235,.12);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,240,235,.34)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:66px;flex:0 0 66px;display:flex;align-items:center;gap:16px;padding:0 26px;background:var(--bone);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--serif);font-size:24px;font-weight:300;text-transform:uppercase;letter-spacing:.08em}
.search{flex:1;max-width:300px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-2);padding:6px 2px}
.search input{border:none;outline:none;background:none;width:100%;font-size:13px}
.search input::placeholder{color:var(--muted-2)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:9px;border:1px solid var(--line-2);padding:6px 10px}
.who select{border:none;outline:none;background:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.content{flex:1;overflow:auto;padding:26px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);padding:10px 20px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;transition:.18s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--bone)}
.btn.dark{background:var(--ink);color:var(--bone)}
.btn.dark:hover{background:transparent;color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:9.5px;letter-spacing:.14em}
.btn.ghost{border-color:var(--line-2);color:var(--muted)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}

/* ---------- misc atoms ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tag.f{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.dot{width:6px;height:6px;display:inline-block;flex:0 0 6px}
.warn{color:var(--rose)}
.card{background:var(--paper);border:1px solid var(--line);padding:16px}
.stat{background:var(--paper);border:1px solid var(--line);padding:16px 18px}
.stat .n{font-family:var(--serif);font-size:38px;line-height:1;font-weight:300}
.stat .l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.grid-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.empty{padding:50px;text-align:center;color:var(--muted-2);font-size:13px;border:1px dashed var(--line-2)}
.seg{display:inline-flex;border:1px solid var(--line-2)}
.seg button{padding:7px 15px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bone)}

/* ---------- kanban ---------- */
.board{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:16px;min-height:70vh}
.col{flex:0 0 258px;width:258px;background:rgba(255,255,255,.5);border:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.over{border-color:var(--ink);background:#fff}
.col .hd{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.col .hd .nm{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;line-height:1.3}
.col .hd .n{margin-left:auto;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.col .hd .ow{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);display:block;margin-top:3px}
.col .body{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
.kc{background:var(--paper);border:1px solid var(--line);padding:12px;cursor:grab;transition:.15s}
.kc:hover{border-color:var(--ink);box-shadow:var(--shadow)}
.kc.drag{opacity:.35}
.kc .nm{font-family:var(--serif);font-size:17px;text-transform:uppercase;letter-spacing:.03em;line-height:1.15}
.kc .meta{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
.kc .row{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.kc .bar{height:2px;background:var(--bone-2);margin-top:10px}
.kc .bar i{display:block;height:2px;background:var(--ink)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line)}
th{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--bone-2);font-size:13px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bone)}
tbody tr:last-child td{border-bottom:none}
td .nm{font-family:var(--serif);font-size:17px;text-transform:uppercase;letter-spacing:.03em}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(28,29,29,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(660px,94vw);background:var(--bone);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dhd{padding:24px 28px 18px;border-bottom:1px solid var(--line);background:var(--ink);color:var(--bone)}
.drawer .dhd h2{font-family:var(--serif);font-size:31px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.drawer .dbd{flex:1;overflow-y:auto;padding:24px 28px 60px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{padding:10px 0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;font-size:13px}
.kv dt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.sec{margin-bottom:26px}
.sec h3{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.close{position:absolute;top:22px;right:26px;font-size:22px;line-height:1;color:var(--bone);opacity:.7}
.close:hover{opacity:1}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl:before{content:'';position:absolute;left:4px;top:5px;bottom:5px;width:1px;background:var(--line-2)}
.tl .it{position:relative;padding-bottom:16px}
.tl .it:before{content:'';position:absolute;left:-22px;top:5px;width:9px;height:9px;border:1px solid var(--ink);background:var(--bone)}
.tl .it.done:before{background:var(--ink)}
.tl .it.cur:before{background:var(--sand);border-color:var(--sand)}
.tl .t{font-size:12.5px;letter-spacing:.02em}
.tl .d{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* ---------- audio ---------- */
.anote{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);padding:11px 13px;margin-bottom:8px}
.anote .play{width:30px;height:30px;flex:0 0 30px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:10px}
.anote .play:hover{background:var(--ink);color:var(--bone)}
.wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}
.wave i{flex:1;background:var(--line-2);min-height:3px}
.rec{display:flex;align-items:center;gap:12px;border:1px dashed var(--line-2);padding:13px;background:rgba(255,255,255,.5)}
.rec.live{border-color:var(--rose);border-style:solid}
.pulse{width:9px;height:9px;background:var(--rose);border-radius:50%;animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- forms ---------- */
.field{margin-bottom:15px}
.field label{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-2);background:var(--paper);padding:9px 11px;outline:none;font-size:13px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--ink-2);line-height:1.45}
.chk input{margin-top:3px;flex:0 0 auto;accent-color:#1C1D1D}
.notice{border-left:2px solid var(--sand);background:rgba(185,164,137,.1);padding:11px 14px;font-size:12px;color:var(--ink-2);margin-bottom:15px}
.notice.rose{border-color:var(--rose);background:rgba(154,91,82,.08)}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
.modal.on{display:flex}
.modal .box{background:var(--bone);border:1px solid var(--line);width:min(620px,100%);max-height:88vh;overflow-y:auto}
.modal .box .mh{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .box .mh h2{font-family:var(--serif);font-size:25px;font-weight:300;text-transform:uppercase;letter-spacing:.05em}
.modal .box .mb{padding:24px 26px}
.modal .box .mf{padding:18px 26px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:rgba(255,255,255,.4)}

/* ---------- tasks ---------- */
.tk{display:flex;gap:13px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:9px}
.tk.done{opacity:.5}
.tk .box{width:16px;height:16px;flex:0 0 16px;border:1px solid var(--ink);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:10px}
.tk .t{font-size:13.5px;letter-spacing:.01em}
.tk.done .t{text-decoration:line-through}
.tk .m{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.tk .ph{display:flex;gap:6px;margin-top:9px}
.tk .ph img{width:54px;height:54px;object-fit:cover;border:1px solid var(--line)}
.who-pill{font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:var(--bone-2);padding:2px 7px;color:var(--ink-2)}

.rem{display:grid;grid-template-columns:78px 1fr auto;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:14px;margin-bottom:9px}
.rem .when{text-align:center;border-right:1px solid var(--bone-2);padding-right:14px}
.rem .when .d{font-family:var(--serif);font-size:26px;line-height:1}
.rem .when .m{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rem.late{border-color:var(--rose)}
.rem.late .when .d{color:var(--rose)}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
/* ---------- mobil: tab bar + sheet ---------- */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--ink);
  padding-bottom:env(safe-area-inset-bottom);border-top:1px solid rgba(241,240,235,.14)}
.tabbar .row{display:flex}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;
  color:rgba(241,240,235,.5);position:relative;min-height:56px;justify-content:center}
.tabbar a.on{color:#fff}
.tabbar a.on:before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--sand)}
.tabbar .i{font-size:16px;line-height:1}
.tabbar .l{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.tabbar .b{position:absolute;top:6px;right:50%;margin-right:-22px;background:var(--sand);color:var(--ink);
  font-size:8.5px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tabbar a.alert .b{background:var(--rose);color:#fff}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--bone);border-top:1px solid var(--line);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .sh{padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.sheet .grip{width:36px;height:3px;background:var(--line-2);margin:0 auto 12px}
.sheet a,.sheet button.it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 20px;border-bottom:1px solid var(--bone-2);font-size:14px}
.sheet .sf{padding:14px 20px 20px}
.mnav{display:none}
.only-m{display:none}

.mchips{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--paper);
  padding:9px 13px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;min-height:38px}
.mchip.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.mchip .n{font-size:10px;opacity:.6}
.mlist{display:flex;flex-direction:column;gap:10px}
.mlist .kc{cursor:pointer}
.mstage{display:flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}

@media(max-width:900px){
  .app{height:100dvh}
  .sidebar{display:none}
  .tabbar{display:block}
  .mnav{display:flex;align-items:center;justify-content:center;width:38px;height:38px;margin-left:-8px;
    border:1px solid var(--line-2);font-size:15px;flex:0 0 38px}
  .only-m{display:inline}
  .hide-m{display:none}

  .topbar{height:auto;flex:0 0 auto;flex-wrap:wrap;padding:10px 14px;gap:9px;position:sticky;top:0;z-index:30}
  .topbar h1{display:none}
  .brandbar{display:flex}
  .topbar .who,.topbar .spacer{display:none}
  .topbar .btn{padding:0;width:38px;height:38px;justify-content:center;font-size:17px;letter-spacing:0}
  .search{order:3;flex:1 1 100%;max-width:none;padding:8px 2px;min-height:38px}

  .content{padding:16px 14px 92px}
  .grid-stats{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
  .grid-stats>.stat:last-child:nth-child(odd){grid-column:1/-1}
  .stat{padding:13px 14px}
  .stat .n{font-size:29px}
  .stat .l{font-size:8.5px;letter-spacing:.14em;margin-top:5px}

  .kc{padding:14px}
  .kc .nm{font-size:19px}
  .kc .meta{font-size:12px}
  .tag{font-size:9.5px;padding:4px 9px}

  .kv{grid-template-columns:1fr;gap:3px 0}
  .kv dt{padding-top:9px}
  .drawer{width:100%;border-left:none}
  .drawer .dhd{padding:18px 18px 16px}
  .drawer .dhd h2{font-size:26px}
  .drawer .dbd{padding:18px 18px 90px}
  .close{top:16px;right:16px;font-size:26px;width:34px;height:34px}
  .tabs{gap:0;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{padding:11px 13px;white-space:nowrap}

  .modal{padding:0;align-items:flex-end}
  .modal .box{width:100%;max-height:92vh;border:none;border-top:1px solid var(--line)}
  .modal .box .mh{padding:18px 18px 14px;position:sticky;top:0;background:var(--bone);z-index:2}
  .modal .box .mb{padding:18px}
  .modal .box .mf{padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom));position:sticky;bottom:0;
    background:var(--bone);box-shadow:0 -8px 16px -12px rgba(28,29,29,.35)}
  .modal .box .mf .btn{flex:1;justify-content:center;padding:14px 10px}
  .f2{grid-template-columns:1fr;gap:0}
  .field input,.field select,.field textarea{padding:12px 12px;font-size:16px}

  .tk{padding:14px}
  .tk .box{width:22px;height:22px;flex:0 0 22px}
  .tk .t{font-size:14px}
  .rem{grid-template-columns:60px 1fr;gap:12px;row-gap:12px}
  .rem>div:last-child{grid-column:1/-1;display:flex;gap:8px}
  .rem>div:last-child .btn{flex:1;justify-content:center;padding:11px}
  .sec h3{font-size:9.5px}
  table{display:none}
}
@media(max-width:380px){
  .tabbar .l{font-size:7.5px;letter-spacing:.06em}
  .topbar h1{font-size:17px}
}
</style>
</head>

    if(v.id==='taskuri') cnt=TASKS.filter(t=>!t.done&&!t.restanta).length;
    if(v.id==='restante')cnt=TASKS.filter(t=>!t.done&&t.restanta).length;
    if(v.id==='remindere')cnt=REMINDERS.filter(r=>!r.done).length;
    h+=`<a href="#" class="${STATE.view===v.id?'on':''}" onclick="go('${v.id}');return false">
        <span class="ico">${v.ico}</span>${v.nm}<span class="cnt">${cnt}</span></a>`;
  });
  document.getElementById('nav').innerHTML=h;
  const sel=document.getElementById('userSel');
  if(!sel.options.length) sel.innerHTML=TEAM.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');

  renderTabbar();
}
function renderTabbar(){
  const cnt={taskuri:TASKS.filter(t=>!t.done&&!t.restanta).length,

             remindere:REMINDERS.filter(r=>!r.done&&days(r.due)<0).length};
  document.getElementById('tabbar').innerHTML='<div class="row">'+TABS.map(t=>{
    const n=cnt[t.id];
    const alert = t.id==='remindere'||t.id==='restante';
    return `<a href="#" class="${STATE.view===t.id?'on':''} ${alert&&n?'alert':''}" onclick="go('${t.id}');return false">

  }).join('')+'</div>';
}

    STATE.view==='echipa'   ? viewEchipa()   : viewReguli();

  if(chip) chip.parentElement.scrollLeft = Math.max(0, chip.offsetLeft - 46);
  if(STATE.drawerId) renderDrawer();
}

/* ---------------- PIPELINE ---------------- */
function viewPipeline(){
  const list=CLIENTS.filter(matched);
  const late=REMINDERS.filter(r=>!r.done&&days(r.due)<0).length;
  const rest=TASKS.filter(t=>t.restanta&&!t.done).length;
  const stats=`<div class="grid-stats">
    <div class="stat"><div class="n">${CLIENTS.length}</div><div class="l">Clienți activi</div></div>
    <div class="stat"><div class="n">${CLIENTS.filter(c=>['delansat','productie'].includes(c.stage)).length}</div><div class="l">În producție</div></div>
    <div class="stat"><div class="n">${CLIENTS.filter(c=>!c.avansPlatit).length}</div><div class="l">Fără avans încasat</div></div>
    <div class="stat"><div class="n">${rest}</div><div class="l">Restanțe deschise</div></div>
    <div class="stat"><div class="n" style="${late?'color:var(--rose)':''}">${late}</div><div class="l">Remindere depășite</div></div>
  </div>`;

  if(MOB()){
    const chips=`<div class="mchips">${STAGES.map(s=>{
      const n=list.filter(c=>c.stage===s.id).length;
      return `<button class="mchip ${STATE.mStage===s.id?'on':''}" onclick="STATE.mStage='${s.id}';render()">
        <span class="dot" style="background:${s.c}"></span>${s.n}. ${esc(s.nm)}<span class="n">${n}</span></button>`;
    }).join('')}</div>`;
    const s=ST(STATE.mStage);
    const items=list.filter(c=>c.stage===STATE.mStage);
    return stats+chips+
      `<div class="mstage"><span class="dot" style="background:${s.c}"></span>${esc(s.nm)} · ${esc(NAME(s.ow))}</div>
       <div class="mlist">${items.length?items.map(c=>kcard(c)).join('')
         :`<div class="empty" style="padding:34px 20px">${esc(s.note)}</div>`}</div>`;
  }

  const toolbar=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
    <div class="seg">
      <button class="${STATE.boardMode==='kanban'?'on':''}" onclick="STATE.boardMode='kanban';render()">Kanban</button>
      <button class="${STATE.boardMode==='lista'?'on':''}" onclick="STATE.boardMode='lista';render()">Listă</button>
    </div>
    <span class="eyebrow">Trage o fișă dintr-o coloană în alta pentru a avansa etapa</span>
  </div>`;

  if(STATE.boardMode==='lista') return stats+toolbar+tableOf(list);

  const cols=STAGES.map(s=>{
    const items=list.filter(c=>c.stage===s.id);
    return `<div class="col" data-stage="${s.id}"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="drop(event,'${s.id}');this.classList.remove('over')">
      <div class="hd">
        <span class="dot" style="background:${s.c}"></span>
        <div style="min-width:0"><div class="nm">${s.n}. ${esc(s.nm)}</div><span class="ow">${esc(NAME(s.ow))}</span></div>
        <span class="n">${items.length}</span>
      </div>
      <div class="body">
        ${items.map(c=>kcard(c)).join('') || `<div style="font-size:11px;color:var(--muted-2);padding:14px 4px;letter-spacing:.05em">${esc(s.note)}</div>`}
      </div></div>`;
  }).join('');
  return stats+toolbar+`<div class="board">${cols}</div>`;
}

function kcard(c, withStage){
  const alerts=[];
  if(!c.avansPlatit && ST(c.stage).n>=5) alerts.push('<span class="tag" style="border-color:var(--rose);color:var(--rose)">Avans neîncasat</span>');
  if(c.santier==='rosu') alerts.push('<span class="tag">La roșu</span>');
  if(c.tip==='cu') alerts.push(`<span class="tag">${esc(c.designer)}</span>`);
  else alerts.push('<span class="tag">Fără proiect</span>');
  const t=days(c.termen);
  const term = c.termen ? `<span class="tag ${t<0?'':''}" style="${t<0?'border-color:var(--rose);color:var(--rose)':''}">${t<0?'Depășit '+Math.abs(t)+'z':'T-'+t+'z'}</span>` : '';
  const nt=TASKS.filter(x=>x.cid===c.id&&!x.done).length;
  const st=ST(c.stage);
  const drg=MOB()?'':`draggable="true" ondragstart="drag(event,'${c.id}')" ondragend="this.classList.remove('drag')"`;
  return `<div class="kc" ${drg} onclick="openClient('${c.id}')">
    ${withStage?`<div class="mstage"><span class="dot" style="background:${st.c}"></span>${st.n}. ${esc(st.nm)}</div>`:''}
    <div class="nm">${esc(c.nume)}</div>
    <div class="meta">${esc(c.adresa)}${c.tel?' · '+esc(c.tel):''}</div>
    <div class="row">${alerts.join('')}${term}${nt?`<span class="tag">${nt} task</span>`:''}${c.audio.length?`<span class="tag">♪ ${c.audio.length}</span>`:''}</div>
    <div class="bar"><i style="width:${progress(c)}%"></i></div>
  </div>`;
}
function drag(e,id){e.dataTransfer.setData('text/plain',id);e.target.classList.add('drag')}
function drop(e,stage){
  e.preventDefault();
  const id=e.dataTransfer.getData('text/plain'); const c=clientById(id); if(!c||c.stage===stage) return;
  const s=ST(stage);
  if(s.n>=6 && !c.avansPlatit){
    if(!confirm(`${c.nume} nu are avansul de ofertare încasat (${AVANS[c.tipLocuinta||'apartament'].toLocaleString('ro-RO')} lei).\n\nRegula procesului: oferta de preț nu se face fără angajament financiar.\n\nContinui totuși?`)) return;
  }
  if(stage==='masur' && c.santier==='rosu'){
    if(!confirm(`${c.nume} are șantierul la roșu. Nu se poate măsura până la șapă turnată + pereți gletuiți.\n\nContinui totuși?`)) return;
  }
  c.stage=stage; c.hist.push([stage,d(0)]); render();
}

function tableOf(list){
  if(!list.length) return `<div class="empty">Niciun client care să corespundă căutării.</div>`;
  if(MOB()) return `<div class="mlist">${list.map(c=>kcard(c,true)).join('')}</div>`;
  return `<table><thead><tr>
    <th>Client</th><th>Etapă</th><th>Tipologie</th><th>Designer</th><th>Responsabil</th><th>Termen</th><th>Avans</th><th>Progres</th>
  </tr></thead><tbody>${list.map(c=>{
    const s=ST(c.stage), t=days(c.termen);
    return `<tr onclick="openClient('${c.id}')">
      <td><div class="nm">${esc(c.nume)}</div><div style="font-size:11px;color:var(--muted)">${esc(c.adresa)}</div></td>
      <td><span class="tag"><span class="dot" style="background:${s.c}"></span>${s.n}. ${esc(s.nm)}</span></td>
      <td style="font-size:11.5px">${tipLabel(c)}<br><span style="color:var(--muted)">${santLabel(c)}</span></td>
      <td style="font-size:12px">${esc(c.designer)}</td>
      <td style="font-size:12px">${esc(NAME(s.ow))}</td>
      <td style="font-size:12px;${t!=null&&t<0?'color:var(--rose)':''}">${fmt(c.termen)}</td>
      <td>${c.avansPlatit?'<span class="tag f">Încasat</span>':'<span class="tag" style="border-color:var(--rose);color:var(--rose)">Neîncasat</span>'}</td>
      <td style="width:110px"><div class="bar" style="height:2px;background:var(--bone-2)"><i style="display:block;height:2px;background:var(--ink);width:${progress(c)}%"></i></div></td>
    </tr>`}).join('')}</tbody></table>`;
}

/* ---------------- TASKS / RESTANTE ---------------- */
function viewTasks(restOnly){
  const mine=TASKS.filter(t=>t.restanta===restOnly);
  const hdr = restOnly
    ? `<div class="notice">Restanțele înlocuiesc grupul de WhatsApp: montatorul bifează lucrarea, încarcă poze și lista de rest la montaj. Task-ul rămâne pe client până la închidere.</div>`
    : `<div class="notice">Task-urile sunt generate automat la fiecare tranziție de etapă și pot fi adăugate manual de coordonator.</div>`;
  const groups={};
  mine.forEach(t=>{(groups[t.who]=groups[t.who]||[]).push(t)});
  const order=TEAM.map(t=>t.id).filter(id=>groups[id]);
  const body = order.length ? order.map(who=>`
    <div class="sec">
      <h3>${esc(NAME(who))} · ${(TEAM.find(t=>t.id===who)||{}).role||''} — ${groups[who].filter(t=>!t.done).length} deschise</h3>
      ${groups[who].sort((a,b)=>(a.done-b.done)||(a.due<b.due?-1:1)).map(taskRow).join('')}
    </div>`).join('') : `<div class="empty">Nimic aici. Curat.</div>`;
  const add=`<div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn" onclick="openTaskModal(${restOnly})">+ ${restOnly?'Restanță nouă':'Task nou'}</button></div>`;
  return hdr+add+body;
}
function taskRow(t){
  const c=clientById(t.cid), dd=days(t.due);
  const late=!t.done&&dd<0;
  return `<div class="tk ${t.done?'done':''}">
    <button class="box" onclick="toggleTask('${t.id}')">${t.done?'✓':''}</button>
    <div style="flex:1;min-width:0">
      <div class="t">${esc(t.t)}</div>
      <div class="m">
        <span class="who-pill">${esc(c?c.nume:'—')}</span>
        <span style="${late?'color:var(--rose)':''}">Termen ${fmt(t.due)}${late?' · depășit '+Math.abs(dd)+'z':''}</span>
        ${t.restanta?'<span>Restanță montaj</span>':''}
      </div>
      ${t.photos.length?`<div class="ph">${t.photos.map(p=>`<img src="${p}">`).join('')}</div>`:''}
      ${t.restanta&&!t.done?`<div style="margin-top:9px"><label class="btn sm ghost" style="cursor:pointer">+ Poză<input type="file" accept="image/*" hidden onchange="addPhoto('${t.id}',this)"></label></div>`:''}
    </div>
    ${c?`<button class="btn sm ghost" onclick="openClient('${c.id}')">Fișă</button>`:''}
  </div>`;
}
function toggleTask(id){const t=TASKS.find(x=>x.id===id);t.done=!t.done;render()}
function addPhoto(id,inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{TASKS.find(x=>x.id===id).photos.push(e.target.result);render()}; r.readAsDataURL(f);
}

function advance(id){

function recBoxHTML(){
  return STATE.recording
   ? `<div class="rec live"><span class="pulse"></span><span style="flex:1;font-size:12.5px">Se înregistrează… <span id="recT">0:00</span></span>
      <button class="btn sm dark" onclick="stopRec(true)">Oprește & salvează</button>
      <button class="btn sm ghost" onclick="stopRec(false)">Renunță</button></div>`
   : `<div class="rec"><span style="font-size:16px">●</span><span style="flex:1;font-size:12.5px;color:var(--muted)">Înregistrează o notă vocală direct din browser</span>
      <button class="btn sm" onclick="startRec()">Înregistrează</button></div>`;
}
let mediaRec=null, chunks=[], recStart=0, recTimer=null;
async function startRec(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(st); chunks=[];
    mediaRec.ondataavailable=e=>chunks.push(e.data);
    mediaRec.onstop=()=>{ st.getTracks().forEach(t=>t.stop());
      if(mediaRec._save){
        const blob=new Blob(chunks,{type:'audio/webm'});
        const sec=Math.round((Date.now()-recStart)/1000);
        const c=clientById(STATE.drawerId);
        c.audio.push({t:Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),
          dsc:prompt('Descriere scurtă a notei vocale:','Notă vocală '+(c.audio.length+1))||'Notă vocală',
          url:URL.createObjectURL(blob)});
      }
      STATE.recording=null; mediaRec=null; clearInterval(recTimer); renderDrawer();
    };
    mediaRec.start(); recStart=Date.now(); STATE.recording=true; renderDrawer();
    recTimer=setInterval(()=>{const el=document.getElementById('recT');if(!el)return;
      const s=Math.round((Date.now()-recStart)/1000);el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},400);
  }catch(err){ alert('Microfonul nu e disponibil în acest context.\n\nÎn aplicația reală, nota vocală se înregistrează din telefon direct în fișa clientului.'); }
}
function stopRec(save){ if(mediaRec&&mediaRec.state!=='inactive'){mediaRec._save=!!save;mediaRec.stop();} else {STATE.recording=null;clearInterval(recTimer);} }
function playNote(cid,i){
  const a=clientById(cid).audio[i];
  if(a.url){ new Audio(a.url).play(); }
  else alert('Notă demo — fără fișier audio atașat.\n\n„'+(a.dsc||'')+'”');
}

function closeModal(){document.getElementById('modal').classList.remove('on')}

      <div class="field"><label>Tip locuință</label><select id="n_loc" onchange="updAvans()">

      <div class="field"><label>Stadiu spațiu</label><select id="n_sant">
        <option value="finisat">Spațiu finisat (șapă + glet)</option>
        <option value="rosu">Șantier la roșu</option></select></div>
    </div>
    <div class="f2">
      <div class="field"><label>Proiect de design</label><select id="n_tip" onchange="updDesigner()">

    </div>
    <div class="field"><label>Specificații (rezumat scris — notele vocale se adaugă din fișă)</label><textarea id="n_obs" rows="3" placeholder="Ce vrea clientul, ce s-a discutat, ce l-a adus la noi…"></textarea></div>
    <div class="notice" id="n_av">Avans de ofertare: <strong>5.000 lei</strong>. Oferta de preț nu se emite înainte de încasare.</div>
    <label class="chk"><input type="checkbox" id="n_gdpr"><span>Clientul a primit și a bifat acordul GDPR înainte de introducerea datelor în sistem.</span></label>
    <label class="chk" style="margin-top:10px"><input type="checkbox" id="n_proc"><span>Clientul a primit procedura cu termenele, calendarul și consecințele nerespectării lor.</span></label>
  </div>
  <div class="mf"><button class="btn ghost" onclick="closeModal()">Renunță</button><button class="btn dark" onclick="saveNew()">Înregistrează client</button></div>`);
}
function updAvans(){const v=document.getElementById('n_loc').value;
  document.getElementById('n_av').innerHTML=`Avans de ofertare: <strong>${AVANS[v].toLocaleString('ro-RO')} lei</strong>. Oferta de preț nu se emite înainte de încasare.`}
function updDesigner(){const cu=document.getElementById('n_tip').value==='cu';document.getElementById('n_des').disabled=!cu;if(!cu)document.getElementById('n_des').value='—'}
function saveNew(){
  const g=id=>document.getElementById(id);
  if(!g('n_nume').value.trim()) return alert('Numele clientului e obligatoriu.');
  if(!g('n_gdpr').checked) return alert('Bifa GDPR este obligatorie înainte de salvare.');
  const c=mk({nume:g('n_nume').value.trim(),tel:g('n_tel').value,adresa:g('n_adr').value,
    tipLocuinta:g('n_loc').value, santier:g('n_sant').value, tip:g('n_tip').value,
    designer:g('n_tip').value==='cu'?g('n_des').value:'—', obs:g('n_obs').value,
    creat:d(0), hist:[['inreg',d(0)]], gdpr:true});
  CLIENTS.unshift(c);
  REMINDERS.push({id:'R'+(Math.random()*1e6|0), cid:c.id, t:'Recall client nou — verifică dacă mergem mai departe', due:d(7), tip:'Recall client nou', done:false});
  TASKS.push({id:'T'+(Math.random()*1e6|0), cid:c.id, t:'Triaj și programare măsurătoare', who:'roxana', due:d(3), done:false, restanta:false, photos:[]});
  closeModal(); STATE.view='pipeline'; render(); openClient(c.id);
}

function openTaskModal(rest, cid){
  modal(`<div class="mh"><h2>${rest?'Restanță nouă':'Task nou'}</h2></div>
  <div class="mb">
    <div class="field"><label>Client</label><select id="t_c">${CLIENTS.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc(c.nume)}</option>`).join('')}</select></div>
    <div class="field"><label>Descriere</label><textarea id="t_t" rows="3" placeholder="${rest?'Ce a rămas de rezolvat la montaj…':'Ce trebuie făcut…'}"></textarea></div>
    <div class="f2">

      <div class="field"><label>Termen</label><input type="date" id="t_d" value="${d(3)}"></div>

function saveTask(rest){
  const g=id=>document.getElementById(id);
  if(!g('t_t').value.trim()) return alert('Descrierea e obligatorie.');
  TASKS.push({id:'T'+(Math.random()*1e6|0),cid:g('t_c').value,t:g('t_t').value.trim(),who:g('t_w').value,due:g('t_d').value,done:false,restanta:rest,photos:[]});
  closeModal(); render();
}

function exportJSON(){
  const data={exportat:new Date().toISOString(),clienti:CLIENTS,taskuri:TASKS,remindere:REMINDERS,echipa:TEAM,etape:STAGES};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
